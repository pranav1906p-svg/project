<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
<style>
    * {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background-color: whitesmoke;
}

.card {
    width: 450px;
    padding: 40px 30px;

    background-color: white;

    text-align: center;

    border-radius: 20px;

    box-shadow: 0 10px 30px lightgray(0, 0, 0, 0.12);

}
.card:hover{
    transition: ;
}

.profile {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    object-fit: cover;

    border: 6px solid #4b35d8;

    padding: 4px;

    background-color: #4b35d8;
}

h1 {
    margin: 20px 0 10px;

    font-size: 32px;
}

h3 {
    margin: 0 0 20px;

    color: #4535c5;
}

p {
    color: #555;
    font-size: 18px;
}

.skills {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin: 25px 0;
}

.skills span {
    padding: 8px 15px;

    background-color: #f0f3ff;

    color: #4535c5;

    border-radius: 20px;

    font-weight: bold;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    padding: 13px 25px;

    border: none;
    border-radius: 8px;

    background-color: #4b35d8;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    background-color: #3522b5;
}
</style>
</head>
